[project]
name = "wialon-fleet-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dfgaitan83", email = "162677396+dfgaitan83@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.162.2",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
