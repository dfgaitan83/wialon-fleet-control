# Configuración de Alembic (migraciones versionadas, ARQ-06).
# La URL de la BD NO va aquí: se lee de DATABASE_URL (ver migrations/env.py).
#   uv run alembic upgrade head      -> aplica todas las migraciones
#   uv run alembic downgrade -1      -> revierte la última
#   uv run alembic revision -m "..." -> crea una nueva (escribirla a mano y revisarla)

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s
