<!doctype html>
<!-- lang="es": lectores de pantalla y traductores usan la pronunciación/idioma correctos -->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Icono de la pestaña: logo de flota (webp recortado a cuadrado) -->
    <link rel="icon" type="image/webp" href="/favicon.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wialon Fleet Control</title>
    <!-- Tipografías (ver --font-sans / --font-mono en shared/ui/styles/tokens.css).
         preconnect adelanta la conexión; display=swap muestra texto con la fuente
         del sistema mientras descarga (sin texto invisible). Solo 2 familias y los pesos usados. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
